{% extends "base.html" %}

{% block content %}
<div class="text-center mb-5">
    <h1 class="display-5 fw-bold text-light">大魔王 <span class="text-red">FAKER</span> 傳奇殿堂大事記</h1>
    <p class="lead text-secondary">收錄《英雄聯盟》歷史第一人李相赫的經典戰役、傳世語錄與生活傳說</p>
</div>

<div class="row g-4">
    {% for post in posts %}
    <div class="col-md-6">
        <div class="card card-faker h-100 p-4 d-flex flex-column justify-content-between">
            <div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge bg-danger">{{ post.badge }}</span>
                    <small class="text-gold fw-bold">{{ post.hero }}</small>
                </div>
                
                <!-- 欄位 1: title -->
                <h3 class="h5 fw-bold text-light mb-2">{{ post.title }}</h3>
                
                <!-- 欄位 2: author -->
                <div class="text-warning small mb-3">
                    <strong>{{ post.author }}</strong>
                </div>

                <!-- 欄位 3: content (首頁先擷取前 90 字) -->
                <p class="text-secondary" style="line-height: 1.6;">
                    {{ post.content | truncate(90, True, '...') }}
                </p>
            </div>

            <div class="mt-3 pt-3 border-top border-secondary d-flex justify-content-between align-items-center">
                <span class="small text-muted">大事記編號 #{{ post.id }}</span>
                <a href="/post/{{ post.id }}" class="btn btn-t1 btn-sm">閱讀完整復盤 →</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
